<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <!-- Turbine silhouette gradient -->
    <linearGradient id="turbineFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#404040"/>
      <stop offset="50%" style="stop-color:#606060"/>
      <stop offset="100%" style="stop-color:#404040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" fill="#fff"/>

  <!-- Border -->
  <rect x="1" y="1" width="598" height="318" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Ground line -->
  <line x1="20" y1="180" x2="580" y2="180" stroke="#000" stroke-width="1"/>

  <!-- === TURBINES (scaled proportionally) === -->

  <!-- 1981 - 10m rotor, smallest -->
  <g transform="translate(45, 180)">
    <!-- Tower -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#505050" stroke-width="2"/>
    <!-- Hub -->
    <circle cx="0" cy="-25" r="2" fill="#404040"/>
    <!-- Blades -->
    <line x1="0" y1="-25" x2="0" y2="-35" stroke="#404040" stroke-width="1.5"/>
    <line x1="0" y1="-25" x2="-8" y2="-20" stroke="#404040" stroke-width="1.5"/>
    <line x1="0" y1="-25" x2="8" y2="-20" stroke="#404040" stroke-width="1.5"/>
  </g>

  <!-- 1985 - 17m rotor -->
  <g transform="translate(120, 180)">
    <!-- Tower -->
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#505050" stroke-width="2.5"/>
    <!-- Hub -->
    <circle cx="0" cy="-40" r="3" fill="#404040"/>
    <!-- Blades -->
    <line x1="0" y1="-40" x2="0" y2="-57" stroke="#404040" stroke-width="2"/>
    <line x1="0" y1="-40" x2="-14" y2="-32" stroke="#404040" stroke-width="2"/>
    <line x1="0" y1="-40" x2="14" y2="-32" stroke="#404040" stroke-width="2"/>
  </g>

  <!-- 1990 - 27m rotor -->
  <g transform="translate(200, 180)">
    <!-- Tower -->
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#505050" stroke-width="3"/>
    <!-- Hub -->
    <circle cx="0" cy="-55" r="4" fill="#404040"/>
    <!-- Blades -->
    <line x1="0" y1="-55" x2="0" y2="-82" stroke="#404040" stroke-width="2"/>
    <line x1="0" y1="-55" x2="-22" y2="-43" stroke="#404040" stroke-width="2"/>
    <line x1="0" y1="-55" x2="22" y2="-43" stroke="#404040" stroke-width="2"/>
  </g>

  <!-- 1996 - 40m rotor -->
  <g transform="translate(295, 180)">
    <!-- Tower -->
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#505050" stroke-width="3.5"/>
    <!-- Hub -->
    <circle cx="0" cy="-75" r="5" fill="#404040"/>
    <!-- Blades -->
    <line x1="0" y1="-75" x2="0" y2="-115" stroke="#404040" stroke-width="2.5"/>
    <line x1="0" y1="-75" x2="-32" y2="-58" stroke="#404040" stroke-width="2.5"/>
    <line x1="0" y1="-75" x2="32" y2="-58" stroke="#404040" stroke-width="2.5"/>
  </g>

  <!-- 1999 - 50m rotor -->
  <g transform="translate(400, 180)">
    <!-- Tower -->
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#505050" stroke-width="4"/>
    <!-- Hub -->
    <circle cx="0" cy="-90" r="6" fill="#404040"/>
    <!-- Blades -->
    <line x1="0" y1="-90" x2="0" y2="-140" stroke="#404040" stroke-width="3"/>
    <line x1="0" y1="-90" x2="-40" y2="-70" stroke="#404040" stroke-width="3"/>
    <line x1="0" y1="-90" x2="40" y2="-70" stroke="#404040" stroke-width="3"/>
  </g>

  <!-- 2000 - 71m rotor, largest -->
  <g transform="translate(520, 180)">
    <!-- Tower -->
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#505050" stroke-width="5"/>
    <!-- Hub -->
    <circle cx="0" cy="-110" r="7" fill="#404040"/>
    <!-- Blades -->
    <line x1="0" y1="-110" x2="0" y2="-175" stroke="#404040" stroke-width="3.5"/>
    <line x1="0" y1="-110" x2="-52" y2="-82" stroke="#404040" stroke-width="3.5"/>
    <line x1="0" y1="-110" x2="52" y2="-82" stroke="#404040" stroke-width="3.5"/>
  </g>

  <!-- === DATA TABLE === -->

  <!-- Table border -->
  <rect x="20" y="195" width="560" height="110" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Row dividers -->
  <line x1="20" y1="220" x2="580" y2="220" stroke="#000" stroke-width="1"/>
  <line x1="20" y1="250" x2="580" y2="250" stroke="#000" stroke-width="1"/>
  <line x1="20" y1="275" x2="580" y2="275" stroke="#000" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="115" y1="195" x2="115" y2="305" stroke="#000" stroke-width="1"/>
  <line x1="190" y1="195" x2="190" y2="305" stroke="#000" stroke-width="1"/>
  <line x1="265" y1="195" x2="265" y2="305" stroke="#000" stroke-width="1"/>
  <line x1="340" y1="195" x2="340" y2="305" stroke="#000" stroke-width="1"/>
  <line x1="425" y1="195" x2="425" y2="305" stroke="#000" stroke-width="1"/>
  <line x1="500" y1="195" x2="500" y2="305" stroke="#000" stroke-width="1"/>

  <!-- Header row (years) -->
  <text x="152" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">1981</text>
  <text x="227" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">1985</text>
  <text x="302" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">1990</text>
  <text x="382" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">1996</text>
  <text x="462" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">1999</text>
  <text x="540" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">2000</text>

  <!-- Row labels -->
  <text x="67" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000">Rotor (meters)</text>
  <text x="67" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000">Rating (KW)</text>
  <text x="67" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000">Annual MWh</text>

  <!-- Rotor data row -->
  <text x="152" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">10</text>
  <text x="227" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">17</text>
  <text x="302" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">27</text>
  <text x="382" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">40</text>
  <text x="462" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">50</text>
  <text x="540" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">71</text>

  <!-- Rating data row -->
  <text x="152" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">25</text>
  <text x="227" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">100</text>
  <text x="302" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">225</text>
  <text x="382" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">550</text>
  <text x="462" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">750</text>
  <text x="540" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">1,650</text>

  <!-- Annual MWh data row -->
  <text x="152" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">45</text>
  <text x="227" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">220</text>
  <text x="302" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">550</text>
  <text x="382" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">1,480</text>
  <text x="462" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">2,200</text>
  <text x="540" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000">5,600</text>

</svg>
